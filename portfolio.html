<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="img/vnd.icon" href="img/icon/document_icon_transparent.webp">
    <link rel="stylesheet" href="style/cssReset.css">
    <link rel="stylesheet" href="style/header.css">
    <link rel="stylesheet" href="style/horloge.css">
    <link rel="stylesheet" href="style/terminal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <title>Portfolio - Terminal Binaire</title>
</head>

<header>
  <div class="upperContainer">
    <div class="upperContainerMain">
      <a href="https://github.com/XanderTheRat" class="imageProfil"> </a>
      <p class="blanc ContainerTitle gras">Portfolio</p>
      <div class="blanc date"><span id="dateHorloge">Aujourd'hui</span> - <span id="heure">00:00:00</span> </div>
      <div class="upperContainerDivider">
      </div>
    </div>
  </div>
</header>

<body>
    <div class="terminal-window">
        <div id="terminal-output" class="terminal-output">
            <span class="system-message">Terminal Binaire (Simulateur Linux) - Type <span class="command-text">help</span> for commands.</span>
        </div>

        <div class="terminal-line interactive-prompt">
            <span class="zsh-prompt user-host" id="current-user">martin@hostname</span><span class="zsh-prompt colon">:</span><span class="zsh-prompt path" id="current-path">/</span><span class="zsh-prompt prompt-symbol">$</span> <span id="interactive-input" contenteditable="true"></span>
        </div>
    </div>
    
    <script src="script/commande.js"></script>
    <script src="script/terminal.js"></script>
    <script>hljs.highlightAll();</script>
</body>
</html>
