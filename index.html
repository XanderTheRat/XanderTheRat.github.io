<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="img/icon/document_icon_transparent.webp">
    <link rel="stylesheet" href="style/waybar.css">
    <link rel="stylesheet" href="style/terminal.css">
    <link rel="stylesheet" href="style/tree.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <title>Portfolio - Waybar Edition</title>
</head>
<body>
    <div id="waybar" class="waybar">
        <div class="modules-left">
            <div id="workspaces">
                <button class="active focused">1</button>
            </div>
        </div>
        <div class="modules-center">
            <div id="custom-date">-- ---</div>
            <div id="custom-clock">--:--:--</div>
        </div>
        <div class="modules-right"></div>
    </div>

    <div class="desktop-workspace">
        <div class="terminal-window">
            <div class="terminal-header-bar">
                <div class="terminal-header-left">
                    <span class="terminal-header-title">martin@portfolio: ~</span>
                </div>
                <div class="terminal-header-actions">
                    <button id="open-tree-btn" class="tree-open-btn" title="Open Tree View (or type 'tree')">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="5" r="3"></circle>
                            <circle cx="6" cy="19" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <path d="M12 8v4M12 12l-6 4M12 12l6 4"></path>
                        </svg>
                        <span>Tree Explorer</span>
                    </button>
                </div>
            </div>

            <div class="terminal-body">
                <div id="terminal-output" class="terminal-output">
                    <span class="system-message">Portfolio Martin Valet (Waybar Edition) - Type <span class="command-text">help</span> for commands.</span>
                </div>

                <div class="terminal-line interactive-prompt">
                    <span class="zsh-prompt user-host" id="current-user">martin@portfolio</span><span class="zsh-prompt colon">:</span><span class="zsh-prompt path" id="current-path">~</span><span class="zsh-prompt prompt-symbol">$</span> <span id="interactive-input" contenteditable="true"></span>
                </div>
            </div>
        </div>
    </div>

    <div id="tree-window-overlay" class="tree-window-overlay hidden">
        <div id="tree-window" class="tree-window">
            <div class="tree-titlebar">
                <div class="tree-titlebar-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#68d391" stroke-width="2">
                        <circle cx="12" cy="5" r="3"></circle>
                        <circle cx="6" cy="19" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <path d="M12 8v4M12 12l-6 4M12 12l6 4"></path>
                    </svg>
                    <span>Tree Explorer</span>
                </div>
                <div class="tree-titlebar-controls">
                    <button id="tree-max-btn" class="window-ctrl-btn" title="Maximize">&#x2922;</button>
                    <button id="tree-close-btn" class="window-ctrl-btn close-btn" title="Close (Esc)">&times;</button>
                </div>
            </div>

            <div class="tree-toolbar">
                <div id="tree-breadcrumbs" class="tree-breadcrumbs"></div>
                <div class="tree-toolbar-actions">
                    <button id="jump-github-btn" class="tree-btn" title="Navigate to ~/github">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <span>~/github</span>
                    </button>
                    <button id="jump-current-btn" class="tree-btn" title="Navigate to current terminal folder">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                        <span>Current directory</span>
                    </button>
                    <button id="jump-home-btn" class="tree-btn" title="Navigate to /home/martin">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span>~</span>
                    </button>
                    <button id="tree-layout-btn" class="tree-btn" title="Toggle horizontal/vertical layout">Horizontal</button>
                    <button id="tree-expand-all-btn" class="tree-btn" title="Expand all branches">+</button>
                    <button id="tree-collapse-all-btn" class="tree-btn" title="Collapse all branches">-</button>
                </div>
            </div>

            <div class="tree-legend">
                <span class="legend-item">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#63b3ed" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <span class="legend-branch">Branch (Directory)</span>: Click to cd
                </span>
                <span class="legend-item">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#68d391" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    <span class="legend-leaf">Leaf (File)</span>: Click to cat
                </span>
            </div>

            <div id="tree-viewport" class="tree-viewport">
                <svg id="tree-svg" class="tree-svg"></svg>

                <div class="tree-zoom-widget">
                    <button id="zoom-in-btn" class="zoom-btn" title="Zoom in">+</button>
                    <button id="zoom-out-btn" class="zoom-btn" title="Zoom out">-</button>
                    <button id="zoom-reset-btn" class="zoom-btn" title="Reset zoom">&#x21bb;</button>
                </div>

                <div id="tree-preview-drawer" class="tree-preview-drawer hidden">
                    <div class="preview-header">
                        <div id="preview-file-name" class="preview-title">Preview</div>
                        <button id="preview-close-btn" class="window-ctrl-btn close-btn" title="Close Preview">&times;</button>
                    </div>
                    <div id="preview-file-body" class="preview-body"></div>
                </div>
            </div>

            <div class="tree-statusbar">
                <span>Active directory: <span id="tree-status-current" class="status-highlight">/</span></span>
                <span id="tree-status-count">0 nodes visible</span>
            </div>
        </div>
    </div>

    <script src="script/core/path.js"></script>
    <script src="script/core/state.js"></script>
    <script src="script/core/filesystem.js"></script>
    <script src="script/core/github.js"></script>
    <script src="script/commands/registry.js"></script>
    <script src="script/commands/handlers.js"></script>
    <script src="script/services/autocomplete.js"></script>
    <script src="script/ui/waybar-panel.js"></script>
    <script src="script/ui/tree-layout.js"></script>
    <script src="script/ui/tree-window.js"></script>
    <script src="script/ui/terminal.js"></script>
    <script src="script/app.js"></script>
    <script src="script/assets.js"></script>
    <script src="script/commande.js"></script>
    <script src="script/tree.js"></script>
    <script src="script/terminal.js"></script>
</body>
</html>
